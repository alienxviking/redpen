name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build (server and web)
        run: npm run build
      # fixtures/provided/ isn't in the repo, so the tests that mark against the
      # supplied rubric skip here; the rest run, with coverage floors enforced.
      - name: Test with coverage
        run: npm run coverage

  # Its own job: a new advisory can turn it red without any change here, and that
  # should read as "a dependency needs a bump", not as the code failing.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
